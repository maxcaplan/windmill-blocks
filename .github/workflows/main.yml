# This workflow builds the project on release tag pushes and uploads a release artifact

name: Build Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ github.ref_name }}
        ZIP_NAME: ${{ github.event.repository.name }}.zip

    steps:
    - uses: actions/checkout@v6

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: /tmp/composer-cache
        key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

    - name: Composer install
      uses: php-actions/composer@v6

    - name: Use PNPM 11
      uses: pnpm/setup@v3
      with:
        version: 11
        runtime: node@24
        cache: true

    - name: Build
      run: pnpm run build

    - name: Package Release
      run: zip -r "$ZIP_NAME" * -x@.distignore

    - name: Create Release
      run: |
        if gh release view "$TAG_NAME" >/dev/null 2>&1; then
          echo "Release $TAG_NAME already exists."
        else
          gh release create "$TAG_NAME" -t "$TAG_NAME" --generate-notes
        fi

    - name: Upload Artifact to Release
      run: gh release upload "$TAG_NAME" "$ZIP_NAME" --clobber
